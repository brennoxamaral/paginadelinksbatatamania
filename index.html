  <style>
    /* ==========================================================================
       CSS Variables & Design Tokens
       ========================================================================== */
    :root {
      --primary: #E1AD01;
      --primary-hover: #C79801;
      --primary-light: #FFF9E6;
      --secondary: #4B3621;
      --surface: #F2EBE3;
      --surface-card: #FFFFFF;
      --surface-card-hover: #FAF7F2;
      --surface-variant: #FAF6F0;
      --on-surface: #4B3621;
      --on-primary: #2B1D12;
      --text-muted: #786553;
      --border-color: rgba(75, 54, 33, 0.10);
      --border-color-hover: rgba(75, 54, 33, 0.22);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 2px 6px rgba(75, 54, 33, 0.04);
      --shadow-md: 0 4px 14px rgba(75, 54, 33, 0.06);
      --shadow-hover: 0 8px 22px rgba(75, 54, 33, 0.12);
      --shadow-primary: 0 6px 18px rgba(225, 173, 1, 0.35);
      
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ==========================================================================
       Reset & Base Styles
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      background-color: var(--surface);
      color: var(--on-surface);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 0;
      margin: 0;
    }

    /* ==========================================================================
       Seamless Potato Pattern Background
       ========================================================================== */
    .bg-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }

    /* ==========================================================================
       Layout Container
       ========================================================================== */
    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 2.25rem 1.25rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ==========================================================================
       Header & Profile Section
       ========================================================================== */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.75rem;
      width: 100%;
    }

    .profile-avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 0.85rem;
    }

    .profile-avatar {
      width: 96px;
      height: 96px;
      border-radius: var(--radius-full);
      object-fit: cover;
      display: block;
      border: 3px solid #FFFFFF;
      box-shadow: 0 4px 16px rgba(75, 54, 33, 0.12);
      background-color: #FFFFFF;
      transition: var(--transition-smooth);
    }

    .profile-avatar:hover {
      transform: scale(1.03);
    }

    .profile-handle {
      font-family: var(--font-body);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--secondary);
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    /* Social Icons Row */
    .social-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .social-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background-color: var(--surface-card);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary);
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-smooth);
    }

    .social-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .social-btn:hover {
      transform: translateY(-2px);
      border-color: var(--border-color-hover);
      box-shadow: var(--shadow-md);
      color: var(--primary-hover);
    }

    .social-btn:active {
      transform: scale(0.95);
    }

    /* ==========================================================================
       Main Action Buttons (Highlights)
       ========================================================================== */
    .main-actions {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
      margin-bottom: 2rem;
    }

    .btn-main {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 56px;
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      transition: var(--transition-smooth);
      box-sizing: border-box;
      cursor: pointer;
    }

    .btn-content-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .btn-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .btn-icon-wrapper svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .btn-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .btn-arrow svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* 1. Primary Highlight Button: Ver Cardápio */
    .btn-primary {
      background-color: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-primary);
      border: 1px solid rgba(225, 173, 1, 0.4);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(199, 152, 1, 0.45);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:hover .btn-arrow {
      transform: translateX(3px);
    }

    /* 2. Secondary Highlight Button: Pedir pelo WhatsApp */
    .btn-whatsapp {
      background-color: var(--surface-card);
      color: var(--secondary);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
    }

    .btn-whatsapp .btn-icon-wrapper {
      color: #25D366;
    }

    .btn-whatsapp:hover {
      background-color: #FFFFFF;
      border-color: rgba(37, 211, 102, 0.4);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .btn-whatsapp:active {
      transform: scale(0.98);
    }

    .btn-whatsapp:hover .btn-arrow {
      transform: translateX(3px);
      color: #25D366;
    }

    /* ==========================================================================
       Category Section: "Produtos que eu utilizo"
       ========================================================================== */
    .category-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2.25rem;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
      padding: 0 0.25rem;
    }

    .category-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .category-line {
      height: 1px;
      background-color: var(--border-color);
      flex-grow: 1;
    }

    /* Product Cards */
    .product-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.65rem 0.85rem;
      text-decoration: none;
      color: var(--secondary);
      box-shadow: var(--shadow-sm);
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .product-card:hover {
      background-color: var(--surface-card-hover);
      border-color: var(--border-color-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .product-card:active {
      transform: scale(0.985);
    }

    .product-info-wrapper {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
    }

    /* Square Thumbnails with rounded-sm (8px) corners */
    .product-thumb-container {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-sm);
      background-color: var(--surface-variant);
      border: 1px solid rgba(75, 54, 33, 0.08);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    /* Dedicated styling for favicon inside square thumbnail */
    .product-thumb-favicon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-thumb,
    .product-card:hover .product-thumb-favicon {
      transform: scale(1.08);
    }

    .product-details {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .product-card .btn-arrow {
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: 0.5rem;
    }

    .product-card:hover .btn-arrow {
      transform: translateX(3px);
      color: var(--secondary);
    }

    /* ==========================================================================
       Footer Section
       ========================================================================== */
    .page-footer {
      width: 100%;
      text-align: center;
      padding-top: 1rem;
      padding-bottom: env(safe-area-inset-bottom, 1rem);
    }

    .copyright-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* ==========================================================================
       Accessibility & Motion Preferences
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
